<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <title>Restablecer Contraseña</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');

      html {
        margin: 0;
        padding: 0;
        border: 0;
      }

      body {
        font-family: "Work Sans", sans-serif !important;
        background-color: #f5f5f5;
        font-size: 19px;
        max-width: 800px;
        margin: 0 auto;
        padding: 3%;
      }

      #wrapper {
        background-color: #f5f5f5;
      }

      h1{
        margin: 3%;
        text-align: center;
        color: #64A70B !important;
      }

      p {
        margin: 3%;
        text-align: center;
        color: #000 !important;
      }

      .btn {
        margin: 0 auto !important;
        background-color: #64A70B;
        color: #f6faff !important;
        text-decoration: none;
        text-align: center !important;
        font-weight: 800;
        padding: 10px 12px;
        border-radius: 8px;
        letter-spacing: 2px;
      }

      @media screen and (max-width: 300px) {
        .btn {
          font-size: 14px !important;
        }
      }


      hr {
        height: 1px;
        background-color: #64A70B;
        clear: both;
        width: 96%;
        margin: auto;
      }

      #contact {
        text-align: center;
        padding-bottom: 3%;
        line-height: 16px;
        font-size: 16px;
        color: #64A70B !important;
      }

    </style>
  </head>
  <body>
    <div id="wrapper">
      <div class="one-col">
        <h1>OSSACRA - Cartilla</h1>

        <p>
          Solicitaste restablecer tu contraseña, no te preocupes, a todos nos pasa.
        </p>

        <p>
          A continuación, hace click en el botón:
        </p>

        <p>
            <a href="{{reemplazar_url}}" class="btn">Restablecer Contraseña</a>
        </p>

        <br>
        <br>
        <br>

        <p style="text-align: left;">
          Recordá que tu contraseña es personal. Si no hiciste esta solicitud, ignorá el correo.
        </p>

        <hr />

        <footer>
          <p id="contact">
            OSSACRA <br />
          </p>
        </footer>
      </div>
    </div>
  </body>
</html>
